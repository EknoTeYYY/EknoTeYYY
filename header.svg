<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#58a6ff;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#a371f7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.08"/>
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="225" y1="0" x2="225" y2="160" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="160" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="675" y1="0" x2="675" y2="160" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Glow blobs -->
  <ellipse cx="160" cy="80" rx="120" ry="60" fill="#58a6ff" fill-opacity="0.04"/>
  <ellipse cx="740" cy="80" rx="120" ry="60" fill="#a371f7" fill-opacity="0.05"/>

  <!-- Wave shape bottom -->
  <path d="M0,130 Q225,100 450,120 Q675,140 900,115 L900,160 L0,160 Z" fill="url(#wave-grad)"/>

  <!-- Accent line -->
  <rect x="0" y="155" width="900" height="2" fill="url(#line)"/>

  <!-- Name -->
  <text x="450" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="#c9d1d9" text-anchor="middle" letter-spacing="2">Erick Souza</text>

  <!-- Divider dot row -->
  <circle cx="390" cy="90" r="1.5" fill="#58a6ff" fill-opacity="0.6"/>
  <circle cx="405" cy="90" r="1.5" fill="#58a6ff" fill-opacity="0.6"/>
  <circle cx="420" cy="90" r="1.5" fill="#a371f7" fill-opacity="0.6"/>
  <circle cx="435" cy="90" r="1.5" fill="#a371f7" fill-opacity="0.6"/>
  <circle cx="450" cy="90" r="1.5" fill="#a371f7" fill-opacity="0.8"/>
  <circle cx="465" cy="90" r="1.5" fill="#a371f7" fill-opacity="0.6"/>
  <circle cx="480" cy="90" r="1.5" fill="#a371f7" fill-opacity="0.6"/>
  <circle cx="495" cy="90" r="1.5" fill="#58a6ff" fill-opacity="0.6"/>
  <circle cx="510" cy="90" r="1.5" fill="#58a6ff" fill-opacity="0.6"/>

  <!-- Subtitle -->
  <text x="450" y="118" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle" letter-spacing="3">SENIOR AI ENGINEER  ·  FOUNDER @ EKNOTECH</text>
</svg>
